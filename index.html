<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visualizador de prova.json</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body class="m-0 bg-gray-100 p-3.5 font-sans text-gray-800 md:p-6">
    <main id="app" class="mx-auto max-w-[980px]">
      <h1 class="mb-4 text-[28px] font-bold leading-tight">
        Visualizador de prova.json
      </h1>

      <section
        class="mb-4 grid gap-3 rounded-xl border border-gray-200 bg-white p-[18px] shadow-sm md:grid-cols-[1fr_240px] md:items-end"
      >
        <div>
          <label class="mb-1.5 block text-sm font-bold" for="fileInput"
            >Arquivo prova.json</label
          >
          <button
            id="fileInput"
            class="w-full box-border rounded-lg border border-gray-300 bg-white p-2.5 text-left text-[15px]"
            type="button"
            @click="handleFileChange"
          >
            Selecionar prova.json
          </button>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-bold" for="questionSelect"
            >Questão</label
          >
          <select
            id="questionSelect"
            class="w-full box-border rounded-lg border border-gray-300 bg-white p-2.5 text-[15px]"
            v-model.number="selectedQuestionIndex"
            :disabled="!questions.length"
            @change="handleQuestionChange"
          >
            <option v-if="!questions.length" disabled value="0">
              {{ selectPlaceholder }}
            </option>
            <option
              v-for="(question, index) in questions"
              :key="question.numero || index"
              :value="index"
            >
              Questão {{ question.numero }}
            </option>
          </select>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-bold" for="examSelect">
            Prova
          </label>
          <select
            id="examSelect"
            class="w-full box-border rounded-lg border border-gray-300 bg-white p-2.5 text-[15px]"
            v-model="selectedExamKey"
            :disabled="!examKeys.length"
            @change="selectedQuestionIndex = 0; resetAnswerState()"
          >
            <option v-for="examKey in examKeys" :key="examKey" :value="examKey">
              {{ examKey }}
            </option>
          </select>
        </div>
      </section>

      <section
        class="mb-4 rounded-xl border border-gray-200 bg-white p-[18px] shadow-sm"
      >
        <p v-if="errorMessage" class="font-bold leading-normal text-red-700">
          {{ errorMessage }}
        </p>

        <p
          v-if="saveMessage"
          class="mb-3 font-bold leading-normal text-green-700"
        >
          {{ saveMessage }}
        </p>

        <p v-if="!currentQuestion" class="leading-normal text-gray-500">
          Carregue um arquivo <strong>prova.json</strong> para visualizar as
          questões.
        </p>

        <template v-else>
          <div>
            <h2 class="mb-3 text-[22px] font-bold leading-tight">
              Questão {{ currentQuestion.numero }}
            </h2>
          </div>

          <section>
            <h3
              class="mb-2.5 mt-[22px] border-b border-gray-200 pb-1.5 text-[17px] font-bold leading-tight"
            >
              Contexto
            </h3>

            <p
              v-if="!currentQuestion.contexto || !currentQuestion.contexto.length"
              class="leading-normal text-gray-500"
            >
              Esta questão não possui contexto.
            </p>

            <div
              v-for="(item, index) in currentQuestion.contexto"
              :key="index"
              class="mb-2.5 rounded-[10px] border border-gray-200 bg-neutral-50 p-3"
            >
              <div class="mb-2 text-xs font-bold uppercase text-gray-500">
                Contexto {{ index + 1 }} · {{ item.mimeType }}
              </div>

              <div
                v-if="item && item.mimeType === 'text/plain'"
                class="whitespace-pre-wrap leading-normal"
                v-html="renderRichText(item.conteudo)"
              ></div>

              <div
                v-else-if="item && item.mimeType && item.mimeType.startsWith('image/')"
              >
                <div
                  v-if="isMissingImage(item.conteudo)"
                  class="rounded-lg border border-red-200 bg-red-50 p-3"
                >
                  <p class="font-bold leading-normal text-red-700">
                    Imagem pendente. Copie a imagem e clique no botão abaixo.
                  </p>
                  <button
                    type="button"
                    class="mt-3 rounded-lg bg-blue-600 px-4 py-2 font-bold text-white hover:bg-blue-700"
                    @click="pasteImage(item)"
                  >
                    Colar imagem da área de transferência
                  </button>
                </div>

                <img
                  v-else
                  class="h-auto max-w-full rounded-lg border border-gray-200 bg-white"
                  alt="Imagem do contexto"
                  :src="buildImageSource(item.mimeType, item.conteudo || '')"
                />
              </div>

              <div v-else class="font-bold leading-normal text-red-700">
                MIME type de contexto não suportado: {{ item && item.mimeType }}
              </div>
            </div>
          </section>

          <section>
            <h3
              class="mb-2.5 mt-[22px] border-b border-gray-200 pb-1.5 text-[17px] font-bold leading-tight"
            >
              Comando
            </h3>
            <div
              class="whitespace-pre-wrap leading-normal"
              v-html="renderRichText(currentQuestion.comando)"
            ></div>
          </section>

          <section>
            <h3
              class="mb-2.5 mt-[22px] border-b border-gray-200 pb-1.5 text-[17px] font-bold leading-tight"
            >
              Alternativas
            </h3>

            <label class="mb-3 flex select-none items-center gap-2 text-sm">
              <input
                class="h-4 w-4"
                type="checkbox"
                v-model="forceShowAnswer"
              />
              Mostrar gabarito
            </label>

            <div v-if="alternativeEntries.length" class="grid gap-2">
              <div
                v-for="[letter, alternative] in alternativeEntries"
                :key="letter"
                role="button"
                tabindex="0"
                class="w-full cursor-pointer rounded-lg border border-gray-200 bg-white p-2.5 text-left font-[inherit] leading-snug text-[inherit] hover:bg-gray-50"
                :class="alternativeClass(letter)"
                @click="selectedAlternative = letter"
                @keydown.enter="selectedAlternative = letter"
                @keydown.space.prevent="selectedAlternative = letter"
              >
                <span class="font-bold">({{ letter }}) </span>

                <span
                  v-if="alternative.mimeType === 'text/plain'"
                  v-html="renderRichText(alternative.conteudo)"
                ></span>

                <div
                  v-else-if="alternative.mimeType.startsWith('image/')"
                  class="mt-2"
                >
                  <div
                    v-if="isMissingImage(alternative.conteudo)"
                    class="rounded-lg border border-red-200 bg-red-50 p-3"
                    @click.stop
                  >
                    <p class="font-bold text-red-700">
                      Imagem pendente. Copie a imagem e clique no botão abaixo.
                    </p>
                    <button
                      type="button"
                      class="mt-3 rounded-lg bg-blue-600 px-4 py-2 font-bold text-white hover:bg-blue-700"
                      @click.stop="pasteImage(alternative)"
                    >
                      Colar imagem da área de transferência
                    </button>
                  </div>

                  <img
                    v-else
                    class="h-auto max-w-full rounded-lg border border-gray-200 bg-white"
                    alt="Imagem da alternativa"
                    :src="buildImageSource(
                      alternative.mimeType,
                      alternative.conteudo
                    )"
                  />
                </div>

                <div v-else class="mt-2 font-bold text-red-700">
                  MIME type não suportado: {{ alternative.mimeType }}
                </div>
              </div>
            </div>

            <p v-else class="leading-normal text-gray-500">
              Esta questão não possui alternativas.
            </p>

            <div v-if="answerStatus" class="mt-2.5 font-bold leading-normal">
              {{ answerStatus }}
            </div>
          </section>
        </template>
      </section>
    </main>

    <script>
      const { computed, createApp, onBeforeUnmount, onMounted, ref, watch } =
        Vue;

      createApp({
        setup() {
          const examKeys = ref([]);
          const selectedExamKey = ref("");
          const questionsByExam = ref({});
          const questions = computed(
            () => questionsByExam.value[selectedExamKey.value] || [],
          );
          const answerKey = ref({});
          const selectedQuestionIndex = ref(0);
          const selectedAlternative = ref(null);
          const forceShowAnswer = ref(false);
          const errorMessage = ref("");
          const selectPlaceholder = ref("Carregue um arquivo");
          const currentFileHandle = ref(null);
          const loadedJson = ref(null);
          const saveMessage = ref("");

          const currentQuestion = computed(() => {
            return questions.value[selectedQuestionIndex.value] || null;
          });

          const normalizedAnswer = computed(() => {
            const numero = currentQuestion.value.numero;

            return String(answerKey.value[numero]).toUpperCase();
          });

          const shouldShowAnswer = computed(() => {
            return forceShowAnswer.value || Boolean(selectedAlternative.value);
          });

          const alternativeEntries = computed(() => {
            const alternatives = currentQuestion.value?.alternativas;

            if (!alternatives || typeof alternatives !== "object") {
              return [];
            }

            return Object.entries(alternatives);
          });

          const answerStatus = computed(() => {
            if (!shouldShowAnswer.value) {
              return "";
            }

            if (!selectedAlternative.value) {
              return "Gabarito: " + normalizedAnswer.value;
            }

            if (selectedAlternative.value === normalizedAnswer.value) {
              return "Correto. Gabarito: " + normalizedAnswer.value;
            }

            return (
              "Resposta selecionada: " +
              selectedAlternative.value +
              ". Gabarito: " +
              normalizedAnswer.value
            );
          });

          function openDatabase() {
            return new Promise((resolve, reject) => {
              const request = indexedDB.open("prova-viewer", 1);

              request.onupgradeneeded = () => {
                request.result.createObjectStore("settings");
              };

              request.onsuccess = () => {
                resolve(request.result);
              };

              request.onerror = () => {
                reject(request.error);
              };
            });
          }

          async function saveFileHandle(fileHandle) {
            const database = await openDatabase();
            const transaction = database.transaction("settings", "readwrite");
            transaction
              .objectStore("settings")
              .put(fileHandle, "jsonFileHandle");
          }

          async function getSavedFileHandle() {
            const database = await openDatabase();

            return new Promise((resolve, reject) => {
              const transaction = database.transaction("settings", "readonly");
              const request = transaction
                .objectStore("settings")
                .get("jsonFileHandle");

              request.onsuccess = () => {
                resolve(request.result || null);
              };

              request.onerror = () => {
                reject(request.error);
              };
            });
          }

          async function reloadCurrentFile() {
            if (!currentFileHandle.value) {
              return;
            }

            const file = await currentFileHandle.value.getFile();

            await loadJsonFile(file);
          }

          async function loadSavedFileHandle() {
            const fileHandle = await getSavedFileHandle();

            if (!fileHandle) {
              return;
            }

            currentFileHandle.value = fileHandle;

            const permission = await fileHandle.queryPermission({
              mode: "read",
            });

            if (permission !== "granted") {
              selectPlaceholder.value =
                "Clique em Selecionar prova.json para escolher o arquivo novamente";
              return;
            }

            await reloadCurrentFile();
          }

          async function loadJsonFile(file) {
            const text = await file.text();
            const json = JSON.parse(text);
            loadedJson.value = json;

            const extractedExams = extractExams(json);
            const firstExamKey = Object.keys(extractedExams)[0] || "";
            const extractedAnswerKey = extractAnswerKey(json);

            examKeys.value = Object.keys(extractedExams);
            questionsByExam.value = extractedExams;

            if (!examKeys.value.length) {
              throw new Error(
                "Nenhuma questão encontrada. Formatos aceitos: prova.questoes, questoes ou chaves de provas na raiz.",
              );
            }

            const savedExam = localStorage.getItem("exam");
            const savedQuestion = localStorage.getItem("question");

            if (savedExam && extractedExams[savedExam]) {
              selectedExamKey.value = savedExam;
            } else {
              selectedExamKey.value = firstExamKey;
            }

            const selectedQuestions =
              extractedExams[selectedExamKey.value] || [];

            const restoredQuestionIndex = Number(savedQuestion);

            if (
              Number.isInteger(restoredQuestionIndex) &&
              restoredQuestionIndex >= 0 &&
              restoredQuestionIndex < selectedQuestions.length
            ) {
              selectedQuestionIndex.value = restoredQuestionIndex;
            } else {
              selectedQuestionIndex.value = 0;
            }

            answerKey.value = extractedAnswerKey;
            selectedAlternative.value = null;
            forceShowAnswer.value = false;
            errorMessage.value = "";
            saveMessage.value = "";
            selectPlaceholder.value = "Carregue um arquivo";
          }

          async function handleFileChange() {
            try {
              const [fileHandle] = await window.showOpenFilePicker({
                types: [
                  {
                    description: "JSON",
                    accept: {
                      "application/json": [".json"],
                    },
                  },
                ],
                multiple: false,
              });

              currentFileHandle.value = fileHandle;

              await saveFileHandle(fileHandle);
              await reloadCurrentFile();
            } catch (error) {
              if (error.name === "AbortError") {
                return;
              }

              resetViewer();
              errorMessage.value = error.message;
            }
          }

          function extractQuestions(json) {
            let extractedQuestions = [];

            if (json?.prova && Array.isArray(json.prova.questoes)) {
              extractedQuestions = json.prova.questoes;
            } else if (Array.isArray(json?.questoes)) {
              extractedQuestions = json.questoes;
            } else if (
              json?.prova?.questoes &&
              typeof json.prova.questoes === "object"
            ) {
              extractedQuestions = Object.entries(json.prova.questoes).map(
                ([numero, question]) => ({
                  ...question,
                  numero: question.numero || numero,
                }),
              );
            } else if (json && typeof json === "object") {
              extractedQuestions = Object.values(json)
                .filter(Array.isArray)
                .flat()
                .map((question) => ({
                  numero: question.questao,
                  contexto: question.saida_esperada?.contexto || [],
                  comando: question.saida_esperada.comando,
                  alternativas: question.saida_esperada.alternativas,
                  gabarito: question.gabarito,
                  motivo: question.motivo,
                }));
            }
            return extractedQuestions.sort(
              (a, b) => Number(a.numero) - Number(b.numero),
            );
          }

          function extractAnswerKey(json) {
            if (
              json.prova?.gabarito &&
              typeof json.prova.gabarito === "object"
            ) {
              return json.prova.gabarito;
            }

            if (json.gabarito && typeof json.gabarito === "object") {
              return json.gabarito;
            }

            return Object.values(json)
              .filter(Array.isArray)
              .flat()
              .reduce((answerKey, question) => {
                if (question.questao && question.gabarito) {
                  answerKey[question.questao] = question.gabarito;
                }

                return answerKey;
              }, {});
          }

          function compareQuestions(a, b) {
            const aNumber = Number.parseInt(
              String(a.numero || "").replace(/\D/g, ""),
              10,
            );
            const bNumber = Number.parseInt(
              String(b.numero || "").replace(/\D/g, ""),
              10,
            );

            return aNumber - bNumber;
          }

          function extractExams(json) {
            if (!json || typeof json !== "object") {
              return {};
            }

            if (json?.prova && Array.isArray(json.prova.questoes)) {
              return {
                Prova: json.prova.questoes
                  .map(normalizeOldQuestion)
                  .sort(compareQuestions),
              };
            }

            if (Array.isArray(json?.questoes)) {
              return {
                Prova: json.questoes.map(normalizeOldQuestion),
              };
            }

            if (
              json?.prova?.questoes &&
              typeof json.prova.questoes === "object"
            ) {
              return {
                Prova: Object.entries(json.prova.questoes)
                  .map(([numero, question]) =>
                    normalizeOldQuestion({
                      ...question,
                      numero: question.numero || numero,
                    }),
                  )
                  .sort(compareQuestions),
              };
            }

            return Object.entries(json)
              .filter(([, value]) => Array.isArray(value))
              .reduce((exams, [examName, examQuestions]) => {
                exams[examName] = examQuestions
                  .map((question) => normalizeNewQuestion(question, examName))
                  .sort(compareQuestions);

                return exams;
              }, {});
          }

          function normalizeOldQuestion(question) {
            return {
              ...question,
              numero: question.numero ?? question.questao,
            };
          }

          function normalizeNewQuestion(question, examName) {
            return {
              exame: examName,
              numero: question.questao,
              contexto: question.saida_esperada.contexto,
              comando: question.saida_esperada.comando,
              alternativas: question.saida_esperada.alternativas,
              gabarito: question.gabarito,
              motivo: question.motivo,
            };
          }

          function isMissingImage(content) {
            return content === "[TODO:ADICIONAR_IMAGEM]";
          }

          async function readClipboardImage() {
            if (!navigator.clipboard?.read) {
              throw new Error(
                "Este navegador não permite ler imagens da área de transferência.",
              );
            }

            const clipboardItems = await navigator.clipboard.read();

            for (const clipboardItem of clipboardItems) {
              const imageType = clipboardItem.types.find((type) =>
                type.startsWith("image/"),
              );

              if (imageType) {
                return clipboardItem.getType(imageType);
              }
            }

            throw new Error(
              "Nenhuma imagem foi encontrada na área de transferência.",
            );
          }

          function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();

              reader.onload = () => resolve(reader.result);
              reader.onerror = () =>
                reject(
                  reader.error || new Error("Não foi possível ler a imagem."),
                );

              reader.readAsDataURL(blob);
            });
          }

          async function ensureWritePermission(fileHandle) {
            const options = { mode: "readwrite" };

            if ((await fileHandle.queryPermission(options)) === "granted") {
              return true;
            }

            return (await fileHandle.requestPermission(options)) === "granted";
          }

          async function saveCurrentJson() {
            if (!currentFileHandle.value || !loadedJson.value) {
              throw new Error("Nenhum arquivo JSON está aberto.");
            }

            const hasPermission = await ensureWritePermission(
              currentFileHandle.value,
            );

            if (!hasPermission) {
              throw new Error(
                "A permissão para modificar o arquivo JSON não foi concedida.",
              );
            }

            const writable = await currentFileHandle.value.createWritable();

            try {
              await writable.write(
                JSON.stringify(loadedJson.value, null, 2) + "\n",
              );
              await writable.close();
            } catch (error) {
              await writable.abort();
              throw error;
            }
          }

          async function pasteImage(target) {
            try {
              saveMessage.value = "";
              errorMessage.value = "";

              const imageBlob = await readClipboardImage();
              const dataUrl = await blobToDataUrl(imageBlob);

              target.mimeType = imageBlob.type || "image/png";
              target.conteudo = dataUrl;

              await saveCurrentJson();

              saveMessage.value =
                "Imagem adicionada e arquivo JSON atualizado com sucesso.";
            } catch (error) {
              errorMessage.value =
                error instanceof Error
                  ? error.message
                  : "Não foi possível adicionar a imagem.";
            }
          }

          function alternativeClass(letter) {
            return {
              "border-blue-300 bg-blue-50":
                selectedAlternative.value === letter,
              "border-green-300 bg-green-50":
                shouldShowAnswer.value && normalizedAnswer.value === letter,
              "border-red-300 bg-red-50":
                selectedAlternative.value === letter &&
                selectedAlternative.value !== normalizedAnswer.value,
            };
          }

          function buildImageSource(mimeType, content) {
            if (content.includes("[TODO:")) {
              const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="160" height="40">
                  <text x="0" y="28"
                        fill="red"
                        font-size="24"
                        font-family="sans-serif"
                        font-weight="bold">
                    TODO
                  </text>
                </svg>
              `;

              return (
                "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg)
              );
            }

            if (content.startsWith("data:")) {
              return content;
            }

            return "data:" + mimeType + ";base64," + content;
          }

          function renderRichText(text) {
            const escaped = String(text)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");

            return escaped.replace(/\*\*(.*?)\*\*/g, "<u>$1</u>");
          }

          function resetAnswerState() {
            selectedAlternative.value = null;
            forceShowAnswer.value = false;
          }

          function resetViewer() {
            questions.value = [];
            answerKey.value = {};
            selectedQuestionIndex.value = 0;
            selectedAlternative.value = null;
            forceShowAnswer.value = false;
            errorMessage.value = "";
            saveMessage.value = "";
            selectPlaceholder.value = "Carregue um arquivo";
          }

          async function refreshCurrentJson() {
            if (!currentFileHandle.value) {
              return;
            }

            localStorage.setItem("exam", selectedExamKey.value);
            localStorage.setItem("question", selectedQuestionIndex.value);

            try {
              await reloadCurrentFile();
            } catch (error) {
              errorMessage.value =
                error instanceof Error
                  ? error.message
                  : "Não foi possível atualizar o arquivo JSON.";
            }
          }

          async function handleQuestionChange() {
            resetAnswerState();
            await refreshCurrentJson();
          }

          async function goToNextQuestion() {
            if (selectedQuestionIndex.value < questions.value.length - 1) {
              selectedQuestionIndex.value += 1;
              resetAnswerState();
            }

            await refreshCurrentJson();
          }

          async function goToPreviousQuestion() {
            if (selectedQuestionIndex.value > 0) {
              selectedQuestionIndex.value -= 1;
              resetAnswerState();
            }

            await refreshCurrentJson();
          }

          function handleKeyDown(event) {
            if (!questions.value.length) {
              return;
            }

            const target = event.target;

            if (
              target instanceof HTMLInputElement ||
              target instanceof HTMLSelectElement ||
              target instanceof HTMLTextAreaElement ||
              target instanceof HTMLButtonElement
            ) {
              return;
            }

            if (event.key === "ArrowRight") {
              goToNextQuestion();
            }

            if (event.key === "ArrowLeft") {
              goToPreviousQuestion();
            }
          }

          watch(
            [selectedExamKey, selectedQuestionIndex],
            ([exam, question]) => {
              localStorage.setItem("exam", exam);
              localStorage.setItem("question", question);
            },
          );

          onMounted(async () => {
            try {
              await loadSavedFileHandle();
            } catch (error) {
              errorMessage.value =
                "Não foi possível reabrir o JSON automaticamente. Clique em Selecionar prova.json para autorizar novamente.";
            }

            window.addEventListener("keydown", handleKeyDown);
          });

          onBeforeUnmount(() => {
            window.removeEventListener("keydown", handleKeyDown);
          });

          return {
            examKeys,
            selectedExamKey,
            questionsByExam,
            questions,
            answerKey,
            selectedQuestionIndex,
            selectedAlternative,
            forceShowAnswer,
            errorMessage,
            selectPlaceholder,
            currentQuestion,
            alternativeEntries,
            answerStatus,
            handleFileChange,
            alternativeClass,
            buildImageSource,
            renderRichText,
            resetAnswerState,
            handleQuestionChange,
            isMissingImage,
            pasteImage,
            saveMessage,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
