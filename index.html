<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visualizador de prova.json</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-0 bg-gray-100 p-3.5 font-sans text-gray-800 md:p-6">
    <main class="mx-auto max-w-[980px]">
      <h1 class="mb-4 text-[28px] font-bold leading-tight">
        Visualizador de prova.json
      </h1>

      <section
        class="mb-4 grid gap-3 rounded-xl border border-gray-200 bg-white p-[18px] shadow-sm md:grid-cols-[1fr_240px] md:items-end"
      >
        <div>
          <label class="mb-1.5 block text-sm font-bold" for="fileInput"
            >Arquivo prova.json</label
          >
          <input
            id="fileInput"
            class="w-full box-border rounded-lg border border-gray-300 bg-white p-2.5 text-[15px]"
            type="file"
            accept="application/json,.json"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-bold" for="questionSelect"
            >Questão</label
          >
          <select
            id="questionSelect"
            class="w-full box-border rounded-lg border border-gray-300 bg-white p-2.5 text-[15px]"
            disabled
          >
            <option>Carregue um arquivo</option>
          </select>
        </div>
      </section>

      <section
        id="viewer"
        class="mb-4 rounded-xl border border-gray-200 bg-white p-[18px] shadow-sm"
      >
        <p class="leading-normal text-gray-500">
          Carregue um arquivo <strong>prova.json</strong> para visualizar as
          questões.
        </p>
      </section>
    </main>

    <script>
      const fileInput = document.getElementById("fileInput");
      const questionSelect = document.getElementById("questionSelect");
      const viewer = document.getElementById("viewer");

      const classNames = {
        viewerCard:
          "mb-4 rounded-xl border border-gray-200 bg-white p-[18px] shadow-sm",
        empty: "leading-normal text-gray-500",
        error: "font-bold leading-normal text-red-700",
        meta: "mb-3.5 flex flex-wrap gap-2",
        pill: "inline-block rounded-full border border-indigo-200 bg-indigo-50 px-2.5 py-1.5 text-[13px]",
        title: "mb-3 text-[22px] font-bold leading-tight",
        heading:
          "mb-2.5 mt-[22px] border-b border-gray-200 pb-1.5 text-[17px] font-bold leading-tight",
        contextItem:
          "mb-2.5 rounded-[10px] border border-gray-200 bg-neutral-50 p-3",
        contextType: "mb-2 text-xs font-bold uppercase text-gray-500",
        textContent: "whitespace-pre-wrap leading-normal",
        imageContent:
          "h-auto max-w-full rounded-lg border border-gray-200 bg-white",
        command: "whitespace-pre-wrap font-bold leading-normal",
        alternatives: "grid gap-2",
        answerControls:
          "mb-3 flex select-none items-center gap-2 text-sm font-bold",
        answerCheckbox: "h-4 w-4",
        alternative:
          "w-full cursor-pointer rounded-lg border border-gray-200 bg-white p-2.5 text-left font-[inherit] leading-snug text-[inherit] hover:bg-gray-50",
        selected: "border-blue-300 bg-blue-50",
        answer: "border-green-300 bg-green-50",
        wrong: "border-red-300 bg-red-50",
        answerStatus: "mt-2.5 font-bold leading-normal",
      };

      let questions = [];
      let selectedAlternative = null;
      let forceShowAnswer = false;

      fileInput.addEventListener("change", async function () {
        const file = fileInput.files[0];

        if (!file) {
          resetViewer();
          return;
        }

        try {
          const text = await file.text();
          const json = JSON.parse(text);
          questions = extractQuestions(json);

          if (!questions.length) {
            throw new Error(
              "Nenhuma questão encontrada. Esperado: prova.questoes{}.",
            );
          }

          populateSelect(questions);
          renderQuestion(questions[0]);
        } catch (error) {
          questions = [];
          questionSelect.disabled = true;
          questionSelect.innerHTML = "<option>Erro ao carregar</option>";
          viewer.innerHTML =
            '<p class="' +
            classNames.error +
            '">' +
            escapeHtml(error.message) +
            "</p>";
        }
      });

      questionSelect.addEventListener("change", function () {
        const index = Number(questionSelect.value);
        selectedAlternative = null;
        forceShowAnswer = false;
        renderQuestion(questions[index]);
      });

      function extractQuestions(json) {
        if (json && json.prova && Array.isArray(json.prova.questoes)) {
          return json.prova.questoes;
        }

        if (json && Array.isArray(json.questoes)) {
          return json.questoes;
        }

        if (
          json &&
          json.prova &&
          json.prova.questoes &&
          typeof json.prova.questoes === "object"
        ) {
          return Object.entries(json.prova.questoes).map(function ([
            numero,
            question,
          ]) {
            return {
              ...question,
              numero: question.numero || numero,
              gabarito:
                question.gabarito ||
                (json.gabarito && json.gabarito[numero]) ||
                (json.prova.gabarito && json.prova.gabarito[numero]) ||
                "",
            };
          });
        }

        return [];
      }

      function populateSelect(items) {
        questionSelect.disabled = false;
        questionSelect.innerHTML = "";

        items.forEach(function (question, index) {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent =
            "Questão " + formatValue(question.numero, index + 1);
          questionSelect.appendChild(option);
        });
      }

      function renderQuestion(question) {
        if (!question) {
          viewer.innerHTML =
            '<p class="' +
            classNames.empty +
            '">Nenhuma questão selecionada.</p>';
          return;
        }

        viewer.innerHTML = "";
        viewer.className = classNames.viewerCard;
        viewer.appendChild(createTitle(question));
        viewer.appendChild(createContextSection(question.contexto));
        viewer.appendChild(createCommandSection(question.comando));
        viewer.appendChild(
          createAlternativesSection(question.alternativas, question.gabarito),
        );
      }

      function createTitle(question) {
        const wrapper = document.createElement("div");
        const title = document.createElement("h2");
        const meta = document.createElement("div");

        title.className = classNames.title;
        title.textContent = "Questão " + formatValue(question.numero, "—");
        meta.className = classNames.meta;

        meta.appendChild(
          createPill("Taxonomia: " + formatValue(question.taxonomiaId, "—")),
        );

        wrapper.appendChild(title);
        wrapper.appendChild(meta);

        return wrapper;
      }

      function createContextSection(context) {
        const section = document.createElement("section");
        const heading = document.createElement("h3");
        heading.className = classNames.heading;
        heading.textContent = "Contexto";
        section.appendChild(heading);

        if (!Array.isArray(context) || !context.length) {
          const empty = document.createElement("p");
          empty.className = classNames.empty;
          empty.textContent = "Esta questão não possui contexto.";
          section.appendChild(empty);
          return section;
        }

        context.forEach(function (item, index) {
          section.appendChild(createContextItem(item, index));
        });

        return section;
      }

      function createContextItem(item, index) {
        const wrapper = document.createElement("div");
        const type = document.createElement("div");

        wrapper.className = classNames.contextItem;
        type.className = classNames.contextType;
        type.textContent =
          "Contexto " +
          (index + 1) +
          " · " +
          formatValue(item && item.tipo, "desconhecido");
        wrapper.appendChild(type);

        if (item && item.tipo === "imagem") {
          if (item.pendente === true) {
            const error = document.createElement("div");

            error.className = classNames.error;
            error.textContent =
              "Imagem pendente. Substitua o campo 'conteudo' pelo base64 da imagem.";

            wrapper.appendChild(error);
            return wrapper;
          }

          const image = document.createElement("img");
          const mimeType = item.mimeType || "image/png";

          image.className = classNames.imageContent;
          image.alt = "Imagem do contexto";
          image.src = buildImageSource(mimeType, item.conteudo || "");

          wrapper.appendChild(image);
          return wrapper;
        }

        const text = document.createElement("div");
        text.className = classNames.textContent;
        text.textContent = item && item.conteudo ? item.conteudo : "";
        wrapper.appendChild(text);

        return wrapper;
      }

      function createCommandSection(command) {
        const section = document.createElement("section");
        const heading = document.createElement("h3");
        const content = document.createElement("div");

        heading.className = classNames.heading;
        heading.textContent = "Comando";
        content.className = classNames.command;
        content.textContent = command || "—";

        section.appendChild(heading);
        section.appendChild(content);

        return section;
      }

      function createAlternativesSection(alternatives, answer) {
        const section = document.createElement("section");
        const heading = document.createElement("h3");
        const controls = document.createElement("label");
        const checkbox = document.createElement("input");
        const list = document.createElement("div");
        const status = document.createElement("div");
        const normalizedAnswer = String(answer || "").toUpperCase();
        const shouldShowAnswer =
          forceShowAnswer || Boolean(selectedAlternative);

        heading.className = classNames.heading;
        heading.textContent = "Alternativas";

        controls.className = classNames.answerControls;
        checkbox.className = classNames.answerCheckbox;
        checkbox.type = "checkbox";
        checkbox.checked = forceShowAnswer;
        checkbox.addEventListener("change", function () {
          forceShowAnswer = checkbox.checked;
          renderQuestion(questions[Number(questionSelect.value)]);
        });
        controls.appendChild(checkbox);
        controls.appendChild(document.createTextNode("Mostrar gabarito"));

        list.className = classNames.alternatives;

        ["A", "B", "C", "D", "E"].forEach(function (letter) {
          const alternative = document.createElement("button");
          const classes = [classNames.alternative];

          alternative.type = "button";

          if (selectedAlternative === letter) {
            classes.push(classNames.selected);
          }

          if (shouldShowAnswer && normalizedAnswer === letter) {
            classes.push(classNames.answer);
          }

          if (
            selectedAlternative === letter &&
            selectedAlternative !== normalizedAnswer
          ) {
            classes.push(classNames.wrong);
          }

          alternative.className = classes.join(" ");
          alternative.textContent =
            "(" +
            letter +
            ") " +
            formatValue(alternatives && alternatives[letter], "—");
          alternative.addEventListener("click", function () {
            selectedAlternative = letter;
            renderQuestion(questions[Number(questionSelect.value)]);
          });
          list.appendChild(alternative);
        });

        status.className = classNames.answerStatus;
        if (shouldShowAnswer) {
          if (selectedAlternative) {
            status.textContent =
              selectedAlternative === normalizedAnswer
                ? "Correto. Gabarito: " + formatValue(normalizedAnswer, "—")
                : "Resposta selecionada: " +
                  selectedAlternative +
                  ". Gabarito: " +
                  formatValue(normalizedAnswer, "—");
          } else {
            status.textContent =
              "Gabarito: " + formatValue(normalizedAnswer, "—");
          }
        }

        section.appendChild(heading);
        section.appendChild(controls);
        section.appendChild(list);
        section.appendChild(status);

        return section;
      }

      function buildImageSource(mimeType, content) {
        if (content.startsWith("data:")) {
          return content;
        }

        return "data:" + mimeType + ";base64," + content;
      }

      function createPill(text) {
        const span = document.createElement("span");
        span.className = classNames.pill;
        span.textContent = text;
        return span;
      }

      function formatValue(value, fallback) {
        if (value === null || value === undefined || value === "") {
          return fallback;
        }

        return String(value);
      }

      function resetViewer() {
        questions = [];
        selectedAlternative = null;
        forceShowAnswer = false;
        questionSelect.disabled = true;
        questionSelect.innerHTML = "<option>Carregue um arquivo</option>";
        viewer.className = classNames.viewerCard;
        viewer.innerHTML =
          '<p class="' +
          classNames.empty +
          '">Carregue um arquivo <strong>prova.json</strong> para visualizar as questões.</p>';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    </script>
  </body>
</html>
