<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visualizador de prova.json</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body class="m-0 bg-gray-100 p-3.5 font-sans text-gray-800 md:p-6">
    <main id="app" class="mx-auto max-w-[980px]">
      <h1 class="mb-4 text-[28px] font-bold leading-tight">
        Visualizador de prova.json
      </h1>

      <section
        class="mb-4 grid gap-3 rounded-xl border border-gray-200 bg-white p-[18px] shadow-sm md:grid-cols-[1fr_240px] md:items-end"
      >
        <div>
          <label class="mb-1.5 block text-sm font-bold" for="fileInput"
            >Arquivo prova.json</label
          >
          <input
            id="fileInput"
            class="w-full box-border rounded-lg border border-gray-300 bg-white p-2.5 text-[15px]"
            type="file"
            accept="application/json,.json"
            @change="handleFileChange"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-bold" for="questionSelect"
            >Questão</label
          >
          <select
            id="questionSelect"
            class="w-full box-border rounded-lg border border-gray-300 bg-white p-2.5 text-[15px]"
            v-model.number="selectedQuestionIndex"
            :disabled="!questions.length"
            @change="resetAnswerState"
          >
            <option v-if="!questions.length" disabled value="0">
              {{ selectPlaceholder }}
            </option>
            <option
              v-for="(question, index) in questions"
              :key="question.numero || index"
              :value="index"
            >
              Questão {{ formatValue(question.numero, index + 1) }}
            </option>
          </select>
        </div>
      </section>

      <section
        class="mb-4 rounded-xl border border-gray-200 bg-white p-[18px] shadow-sm"
      >
        <p v-if="errorMessage" class="font-bold leading-normal text-red-700">
          {{ errorMessage }}
        </p>

        <p v-else-if="!currentQuestion" class="leading-normal text-gray-500">
          Carregue um arquivo <strong>prova.json</strong> para visualizar as
          questões.
        </p>

        <template v-else>
          <div>
            <h2 class="mb-3 text-[22px] font-bold leading-tight">
              Questão {{ formatValue(currentQuestion.numero, '—') }}
            </h2>
          </div>

          <section>
            <h3
              class="mb-2.5 mt-[22px] border-b border-gray-200 pb-1.5 text-[17px] font-bold leading-tight"
            >
              Contexto
            </h3>

            <p
              v-if="!currentQuestion.contexto || !currentQuestion.contexto.length"
              class="leading-normal text-gray-500"
            >
              Esta questão não possui contexto.
            </p>

            <div
              v-for="(item, index) in currentQuestion.contexto"
              :key="index"
              class="mb-2.5 rounded-[10px] border border-gray-200 bg-neutral-50 p-3"
            >
              <div class="mb-2 text-xs font-bold uppercase text-gray-500">
                Contexto {{ index + 1 }} · {{ formatValue(item && item.tipo,
                'desconhecido') }}
              </div>

              <div
                v-if="item && item.tipo === 'imagem' && item.pendente === true"
                class="font-bold leading-normal text-red-700"
              >
                Imagem pendente. Substitua o campo 'conteudo' pelo base64 da
                imagem.
              </div>

              <img
                v-else-if="item && item.tipo === 'imagem'"
                class="h-auto max-w-full rounded-lg border border-gray-200 bg-white"
                alt="Imagem do contexto"
                :src="buildImageSource(item.mimeType || 'image/png', item.conteudo || '')"
              />

              <div v-else class="whitespace-pre-wrap leading-normal">
                {{ item && item.conteudo ? item.conteudo : '' }}
              </div>
            </div>
          </section>

          <section>
            <h3
              class="mb-2.5 mt-[22px] border-b border-gray-200 pb-1.5 text-[17px] font-bold leading-tight"
            >
              Comando
            </h3>
            <div class="whitespace-pre-wrap leading-normal">
              {{ currentQuestion.comando || '—' }}
            </div>
          </section>

          <section>
            <h3
              class="mb-2.5 mt-[22px] border-b border-gray-200 pb-1.5 text-[17px] font-bold leading-tight"
            >
              Alternativas
            </h3>

            <label class="mb-3 flex select-none items-center gap-2 text-sm">
              <input
                class="h-4 w-4"
                type="checkbox"
                v-model="forceShowAnswer"
              />
              Mostrar gabarito
            </label>

            <div v-if="alternativeEntries.length" class="grid gap-2">
              <button
                v-for="[letter, text] in alternativeEntries"
                :key="letter"
                type="button"
                class="w-full cursor-pointer rounded-lg border border-gray-200 bg-white p-2.5 text-left font-[inherit] leading-snug text-[inherit] hover:bg-gray-50"
                :class="alternativeClass(letter)"
                @click="selectedAlternative = letter"
              >
                ({{ letter }}) {{ formatValue(text, '—') }}
              </button>
            </div>

            <p v-else class="leading-normal text-gray-500">
              Esta questão não possui alternativas.
            </p>

            <div v-if="answerStatus" class="mt-2.5 font-bold leading-normal">
              {{ answerStatus }}
            </div>
          </section>
        </template>
      </section>
    </main>

    <script>
      const { computed, createApp, ref } = Vue;

      createApp({
        setup() {
          const questions = ref([]);
          const answerKey = ref({});
          const selectedQuestionIndex = ref(0);
          const selectedAlternative = ref(null);
          const forceShowAnswer = ref(false);
          const errorMessage = ref("");
          const selectPlaceholder = ref("Carregue um arquivo");

          const currentQuestion = computed(() => {
            return questions.value[selectedQuestionIndex.value] || null;
          });

          const normalizedAnswer = computed(() => {
            const numero = currentQuestion.value?.numero;

            return String(answerKey.value?.[numero] || "").toUpperCase();
          });

          const shouldShowAnswer = computed(() => {
            return forceShowAnswer.value || Boolean(selectedAlternative.value);
          });

          const alternativeEntries = computed(() => {
            const alternatives = currentQuestion.value?.alternativas;

            if (!alternatives || typeof alternatives !== "object") {
              return [];
            }

            return Object.entries(alternatives);
          });

          const answerStatus = computed(() => {
            if (!shouldShowAnswer.value) {
              return "";
            }

            if (!selectedAlternative.value) {
              return "Gabarito: " + formatValue(normalizedAnswer.value, "—");
            }

            if (selectedAlternative.value === normalizedAnswer.value) {
              return (
                "Correto. Gabarito: " + formatValue(normalizedAnswer.value, "—")
              );
            }

            return (
              "Resposta selecionada: " +
              selectedAlternative.value +
              ". Gabarito: " +
              formatValue(normalizedAnswer.value, "—")
            );
          });

          async function handleFileChange(event) {
            const file = event.target.files[0];

            if (!file) {
              resetViewer();
              return;
            }

            try {
              const text = await file.text();
              const json = JSON.parse(text);
              const extractedQuestions = extractQuestions(json);
              const extractedAnswerKey = extractAnswerKey(json);

              if (!extractedQuestions.length) {
                throw new Error(
                  "Nenhuma questão encontrada. Esperado: prova.questoes{}.",
                );
              }

              questions.value = extractedQuestions;
              answerKey.value = extractedAnswerKey;
              selectedQuestionIndex.value = 0;
              selectedAlternative.value = null;
              forceShowAnswer.value = false;
              errorMessage.value = "";
              selectPlaceholder.value = "Carregue um arquivo";
            } catch (error) {
              questions.value = [];
              answerKey.value = {};
              selectedQuestionIndex.value = 0;
              selectedAlternative.value = null;
              forceShowAnswer.value = false;
              errorMessage.value = error.message;
              selectPlaceholder.value = "Erro ao carregar";
            }
          }

          function extractQuestions(json) {
            let extractedQuestions = [];

            if (json?.prova && Array.isArray(json.prova.questoes)) {
              extractedQuestions = json.prova.questoes;
            } else if (Array.isArray(json?.questoes)) {
              extractedQuestions = json.questoes;
            } else if (
              json?.prova?.questoes &&
              typeof json.prova.questoes === "object"
            ) {
              extractedQuestions = Object.entries(json.prova.questoes).map(
                ([numero, question]) => ({
                  ...question,
                  numero: question.numero || numero,
                }),
              );
            }

            return extractedQuestions.sort(
              (a, b) => Number(a.numero) - Number(b.numero),
            );
          }

          function extractAnswerKey(json) {
            if (!json?.gabarito || typeof json.gabarito !== "object") {
              return {};
            }

            return json.gabarito;
          }

          function alternativeClass(letter) {
            return {
              "border-blue-300 bg-blue-50":
                selectedAlternative.value === letter,
              "border-green-300 bg-green-50":
                shouldShowAnswer.value && normalizedAnswer.value === letter,
              "border-red-300 bg-red-50":
                selectedAlternative.value === letter &&
                selectedAlternative.value !== normalizedAnswer.value,
            };
          }

          function buildImageSource(mimeType, content) {
            if (content.startsWith("data:")) {
              return content;
            }

            return "data:" + mimeType + ";base64," + content;
          }

          function formatValue(value, fallback) {
            if (value === null || value === undefined || value === "") {
              return fallback;
            }

            return String(value);
          }

          function resetAnswerState() {
            selectedAlternative.value = null;
            forceShowAnswer.value = false;
          }

          function resetViewer() {
            questions.value = [];
            answerKey.value = {};
            selectedQuestionIndex.value = 0;
            selectedAlternative.value = null;
            forceShowAnswer.value = false;
            errorMessage.value = "";
            selectPlaceholder.value = "Carregue um arquivo";
          }

          return {
            questions,
            answerKey,
            selectedQuestionIndex,
            selectedAlternative,
            forceShowAnswer,
            errorMessage,
            selectPlaceholder,
            currentQuestion,
            alternativeEntries,
            answerStatus,
            handleFileChange,
            alternativeClass,
            buildImageSource,
            formatValue,
            resetAnswerState,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
