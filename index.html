        function extractObjectKeyOrder(text, propertyName) {
          const escapedPropertyName = propertyName.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&",
          );
          const propertyMatch = new RegExp(
            `"${escapedPropertyName}"\\s*:\\s*\\{`,
          ).exec(text);

          if (!propertyMatch) {
            return [];
          }

          const objectStart = text.indexOf("{", propertyMatch.index);
          const keys = [];
          let depth = 1;
          let index = objectStart + 1;

          while (index < text.length && depth > 0) {
            const character = text[index];

            if (character === '"') {
              const stringStart = index;
              index += 1;

              while (index < text.length) {
                if (text[index] === "\\") {
                  index += 2;
                  continue;
                }

                if (text[index] === '"') {
                  break;
                }

                index += 1;
              }

              const stringEnd = index;

              if (depth === 1) {
                let nextIndex = stringEnd + 1;

                while (/\s/.test(text[nextIndex] || "")) {
                  nextIndex += 1;
                }

                if (text[nextIndex] === ":") {
                  try {
                    keys.push(
                      JSON.parse(text.slice(stringStart, stringEnd + 1)),
                    );
                  } catch {
                    return [];
                  }
                }
              }
            } else if (character === "{") {
              depth += 1;
            } else if (character === "}") {
              depth -= 1;
            }

            index += 1;
          }

          return keys;
        }

        function stringifyJsonPreservingQuestionOrder(value) {
          const indentation = "  ";

          function serialize(currentValue, depth, path) {
            if (
              currentValue === null ||
              typeof currentValue === "number" ||
              typeof currentValue === "boolean" ||
              typeof currentValue === "string"
            ) {
              return JSON.stringify(currentValue);
            }

            if (Array.isArray(currentValue)) {
              if (!currentValue.length) {
                return "[]";
              }

              const items = currentValue.map(
                (item, index) =>
                  indentation.repeat(depth + 1) +
                  serialize(item, depth + 1, [...path, index]),
              );

              return `[\n${items.join(",\n")}\n${indentation.repeat(depth)}]`;
            }

            if (typeof currentValue === "object") {
              let keys = Object.keys(currentValue);

              if (path.length === 1) {
                const preservedOrder =
                  path[0] === "questoes"
                    ? questionKeyOrder.value
                    : path[0] === "gabarito"
                      ? answerKeyOrder.value
                      : null;

                if (preservedOrder) {
                  const existingKeys = new Set(keys);
                  const preservedKeys = preservedOrder.filter((key) =>
                    existingKeys.has(key),
                  );
                  const newKeys = keys.filter(
                    (key) => !preservedOrder.includes(key),
                  );

                  keys = [...preservedKeys, ...newKeys];
                }
              }

              if (!keys.length) {
                return "{}";
              }

              const properties = keys.map(
                (key) =>
                  indentation.repeat(depth + 1) +
                  `${JSON.stringify(key)}: ${serialize(
                    currentValue[key],
                    depth + 1,
                    [...path, key],
                  )}`,
              );

              return `{\n${properties.join(",\n")}\n${indentation.repeat(depth)}}`;
            }

            return undefined;
          }

          return serialize(value, 0, []);
        }

        async function saveCurrentJson(json = loadedJson.value) {
          if (!currentFileHandle.value || !json) {
            throw new Error("Nenhum arquivo JSON está aberto.");
          }

          const hasPermission = await ensureWritePermission(
            currentFileHandle.value,
          );

          if (!hasPermission) {
            throw new Error(
              "A permissão para modificar o arquivo JSON não foi concedida.",
            );
          }

          const writable = await currentFileHandle.value.createWritable();

          try {
            await writable.write(
              stringifyJsonPreservingQuestionOrder(json) + "\n",
            );
            await writable.close();
          } catch (error) {
            await writable.abort();
            throw error;
          }
        }

        function getJsonErrorMessage(error, text) {
          if (!(error instanceof SyntaxError)) {
            return error instanceof Error ? error.message : String(error);
          }

          const positionMatch = error.message.match(/position\s+(\d+)/i);

          if (!positionMatch) {
            return error.message;
          }

          const position = Number(positionMatch[1]);
          const beforeError = text.slice(0, position);
          const line = beforeError.split("\n").length;
          const lastLineBreak = beforeError.lastIndexOf("\n");
          const column = position - lastLineBreak;

          return `${error.message} (linha ${line}, coluna ${column})`;
        }

        function getJsonEditorText() {
          return jsonEditorText.value;
        }

        function parseJsonEditor() {
          const text = getJsonEditorText();

          try {
            const parsedJson = JSON.parse(text);
            jsonEditorError.value = "";
            return parsedJson;
          } catch (error) {
            jsonEditorError.value = getJsonErrorMessage(error, text);
            return null;
          }
        }

        function validateJsonEditor() {
          parseJsonEditor();
        }

        function pathKey(path) {
          return JSON.stringify(path);
        }

        function maskContentValues(value, path = []) {
          if (Array.isArray(value)) {
            return value.map((item, index) =>
              maskContentValues(item, [...path, index]),
            );
          }

          if (value && typeof value === "object") {
            return Object.fromEntries(
              Object.entries(value).map(([key, childValue]) => {
                const childPath = [...path, key];

                if (
                  key === "conteudo" &&
                  typeof childValue === "string" &&
                  childValue.startsWith("data:")
                ) {
                  hiddenContentValues.set(pathKey(childPath), childValue);
                  return [key, "..."];
                }

                return [key, maskContentValues(childValue, childPath)];
              }),
            );
          }

          return value;
        }

        function restoreMaskedContentValues(value, path = []) {
          if (Array.isArray(value)) {
            return value.map((item, index) =>
              restoreMaskedContentValues(item, [...path, index]),
            );
          }

          if (value && typeof value === "object") {
            return Object.fromEntries(
              Object.entries(value).map(([key, childValue]) => {
                const childPath = [...path, key];
                const hiddenKey = pathKey(childPath);

                if (
                  key === "conteudo" &&
                  childValue === "..." &&
                  hiddenContentValues.has(hiddenKey)
                ) {
                  return [key, hiddenContentValues.get(hiddenKey)];
                }

                return [
                  key,
                  restoreMaskedContentValues(childValue, childPath),
                ];
              }),
            );
          }

          return value;
        }

        function initializeQuestionJsonEditor(value) {
          hiddenContentValues.clear();
          const maskedValue = maskContentValues(value);
          jsonEditorText.value = JSON.stringify(maskedValue, null, 2);
          jsonEditorError.value = "";
        }

        function findCurrentQuestionSource() {
          const json = loadedJson.value;
          const questionNumber = String(currentQuestion.value?.numero ?? "");

          if (!json || !questionNumber) {
            return null;
          }

          if (
            json.questoes &&
            typeof json.questoes === "object" &&
            !Array.isArray(json.questoes)
          ) {
            const entry = Object.entries(json.questoes).find(
              ([key, question]) =>
                String(question.numero ?? question.questao ?? key) ===
                questionNumber,
            );

            if (entry) {
              const [key, question] = entry;

              return {
                schema: "exam",
                question,
                setQuestion(updatedQuestion) {
                  json.questoes[key] = updatedQuestion;
                },
              };
            }
          }

          const examQuestions = json[selectedExamKey.value];

          if (Array.isArray(examQuestions)) {
            const index = examQuestions.findIndex(
              (question) => String(question.questao ?? "") === questionNumber,
            );

            if (index >= 0) {
              return {
                schema: "test",
                question: examQuestions[index],
                setQuestion(updatedQuestion) {
                  examQuestions[index] = updatedQuestion;
                },
              };
            }
          }

          return null;
        }

        function getExamAnswerKey() {
          const json = loadedJson.value;

          if (json?.gabarito && typeof json.gabarito === "object") {
            return json.gabarito;
          }

          return null;
        }

        function buildQuestionEditorValue(source) {
          const editorValue = JSON.parse(JSON.stringify(source.question));

          if (source.schema === "exam") {
            const questionNumber = String(currentQuestion.value.numero);
            const examAnswerKey = getExamAnswerKey();

            editorValue.fonte = loadedJson.value?.fonte ?? "";

            if (examAnswerKey && questionNumber in examAnswerKey) {
              editorValue.gabarito = examAnswerKey[questionNumber];
            }
          }

          return editorValue;
        }

        function openJsonEditor() {
          if (isReadOnly.value) {
            return;
          }

          const source = findCurrentQuestionSource();

          if (!source) {
            errorMessage.value =
              "Não foi possível localizar a questão selecionada no JSON original.";
            return;
          }

          const editorValue = buildQuestionEditorValue(source);
          jsonEditorError.value = "";
          isJsonEditorOpen.value = true;

          requestAnimationFrame(() => {
            initializeQuestionJsonEditor(editorValue);
          });
        }

        function closeJsonEditor() {
          if (isSavingJson.value) {
            return;
          }

          isJsonEditorOpen.value = false;
          jsonEditorError.value = "";
          hiddenContentValues.clear();
        }

        function formatJsonEditor() {
          const parsedJson = parseJsonEditor();

          if (parsedJson) {
            jsonEditorText.value = JSON.stringify(parsedJson, null, 2);
          }
        }

        async function saveJsonEditor() {
          const parsedQuestion = parseJsonEditor();

          if (!parsedQuestion || isSavingJson.value) {
            return;
          }

          if (
            Array.isArray(parsedQuestion) ||
            typeof parsedQuestion !== "object"
          ) {
            jsonEditorError.value = "A questão deve ser um objeto JSON.";
            return;
          }

          const source = findCurrentQuestionSource();

          if (!source) {
            jsonEditorError.value =
              "Não foi possível localizar a questão selecionada no JSON original.";
            return;
          }

          try {
            isSavingJson.value = true;
            errorMessage.value = "";
            saveMessage.value = "";

            const restoredQuestion =
              restoreMaskedContentValues(parsedQuestion);
            const updatedQuestion = JSON.parse(
              JSON.stringify(restoredQuestion),
            );

            if (source.schema === "exam") {
              const questionNumber = String(currentQuestion.value.numero);
              const examAnswerKey = getExamAnswerKey();

              if (
                Object.prototype.hasOwnProperty.call(updatedQuestion, "fonte")
              ) {
                loadedJson.value.fonte = updatedQuestion.fonte;
                delete updatedQuestion.fonte;
              }

              if (
                Object.prototype.hasOwnProperty.call(
                  updatedQuestion,
                  "gabarito",
                )
              ) {
                if (!examAnswerKey) {
                  throw new Error(
                    "O arquivo da prova não possui um objeto gabarito que possa ser atualizado.",
                  );
                }

                examAnswerKey[questionNumber] = updatedQuestion.gabarito;
                delete updatedQuestion.gabarito;
              }
            }

            source.setQuestion(updatedQuestion);
            await saveCurrentJson(loadedJson.value);
            await reloadCurrentFile();

            isJsonEditorOpen.value = false;
            saveMessage.value =
              "Questão validada e arquivo JSON atualizado com sucesso.";
          } catch (error) {
            jsonEditorError.value =
              error instanceof Error
                ? error.message
                : "Não foi possível salvar a questão.";
          } finally {
            isSavingJson.value = false;
          }
        }

        async function pasteImage(target) {
          if (isReadOnly.value) {
            return;
          }

          try {
            saveMessage.value = "";
            errorMessage.value = "";

            const imageBlob = await readClipboardImage();
            const dataUrl = await blobToDataUrl(imageBlob);

            target.mimeType = imageBlob.type || "image/png";
            target.conteudo = dataUrl;

            await saveCurrentJson();

            saveMessage.value =
              "Imagem adicionada e arquivo JSON atualizado com sucesso.";
          } catch (error) {
            errorMessage.value =
              error instanceof Error
                ? error.message
                : "Não foi possível adicionar a imagem.";
          }
        }

        function alternativeClass(letter) {
          return {
            "border-blue-300 bg-blue-50":
              selectedAlternative.value === letter,
            "border-green-300 bg-green-50":
              shouldShowAnswer.value && normalizedAnswer.value === letter,
            "border-red-300 bg-red-50":
              selectedAlternative.value === letter &&
              selectedAlternative.value !== normalizedAnswer.value,
          };
        }

        function buildImageSource(mimeType, content) {
          if (content.includes("[TODO:")) {
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="160" height="40">
                  <text x="0" y="28"
                        fill="red"
                        font-size="24"
                        font-family="sans-serif"
                        font-weight="bold">
                    TODO
                  </text>
                </svg>
              `;

            return (
              "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg)
            );
          }

          if (content.startsWith("data:")) {
            return content;
          }

          return "data:" + mimeType + ";base64," + content;
        }

        function renderRichText(text) {
          const escaped = String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

          return escaped.replace(/\*\*(.*?)\*\*/g, "<u>$1</u>");
        }

        function resetAnswerState() {
          selectedAlternative.value = null;
          forceShowAnswer.value = false;
        }

        function resetViewer() {
          examKeys.value = [];
          selectedExamKey.value = "";
          questionsByExam.value = {};
          answerKey.value = {};
          selectedQuestionIndex.value = 0;
          selectedAlternative.value = null;
          forceShowAnswer.value = false;
          errorMessage.value = "";
          saveMessage.value = "";
          selectPlaceholder.value = "Carregue um arquivo";
        }

        async function refreshCurrentJson() {
          if (isReadOnly.value || !currentFileHandle.value) {
            return;
          }

          localStorage.setItem("exam", selectedExamKey.value);
          localStorage.setItem("question", selectedQuestionIndex.value);

          try {
            await reloadCurrentFile();
          } catch (error) {
            errorMessage.value =
              error instanceof Error
                ? error.message
                : "Não foi possível atualizar o arquivo JSON.";
          }
        }

        async function handleQuestionChange() {
          resetAnswerState();
          await refreshCurrentJson();
        }

        async function goToNextQuestion() {
          if (selectedQuestionIndex.value < questions.value.length - 1) {
            selectedQuestionIndex.value += 1;
            resetAnswerState();
          }

          await refreshCurrentJson();
        }

        async function goToPreviousQuestion() {
          if (selectedQuestionIndex.value > 0) {
            selectedQuestionIndex.value -= 1;
            resetAnswerState();
          }

          await refreshCurrentJson();
        }

        function handleKeyDown(event) {
          if (isJsonEditorOpen.value) {
            return;
          }

          if (!questions.value.length) {
            return;
          }

          const target = event.target;

          if (
            target instanceof HTMLInputElement ||
            target instanceof HTMLSelectElement ||
            target instanceof HTMLTextAreaElement ||
            target instanceof HTMLButtonElement
          ) {
            return;
          }

          if (event.key === "ArrowRight") {
            goToNextQuestion();
          }

          if (event.key === "ArrowLeft") {
            goToPreviousQuestion();
          }
        }

        watch(
          [
            selectedContentPath,
            selectedExamFiles,
            chartMetric,
            statisticsFiltersCollapsed,
          ],
          () => {
            renderStatisticsCharts();
          },
          { deep: true, flush: "post" },
        );

        watch(
          selectedExamFiles,
          () => {
            selectedExamPatterns.value = examPatternEntries.value
              .filter(([pattern]) => isPatternFullySelected(pattern))
              .map(([pattern]) => pattern);

            if (isReadOnly.value) {
              clearLoadedQuestions();
            }
          },
          { deep: true },
        );

        watch(
          [selectedExamKey, selectedQuestionIndex],
          ([exam, question]) => {
            localStorage.setItem("exam", exam);
            localStorage.setItem("question", question);
          },
        );

        onMounted(() => {
          window.addEventListener("keydown", handleKeyDown);
          window.addEventListener("resize", resizeStatisticsCharts);
        });

        onBeforeUnmount(() => {
          window.removeEventListener("keydown", handleKeyDown);
          window.removeEventListener("resize", resizeStatisticsCharts);
          disposeStatisticsCharts();
        });

        return {
          appMode,
          isReadOnly,
          openEditMode,
          openStatisticsMode,
          returnToHome,
          thematicIndex,
          statisticsDirectoryName,
          examPatternEntries,
          examFolderEntries,
          examFileMap,
          selectedExamPatterns,
          selectedExamFiles,
          expandedExamPatterns,
          expandedExamFolders,
          statisticsFiltersCollapsed,
          selectedPatternCount,
          selectedContentPath,
          questionViewerSection,
          contentHeatmapElement,
          contentRankingElement,
          chartMetric,
          rankingChartHeight,
          contentTree,
          filteredQuestionIds,
          selectedFileCount,
          unindexedExamNames,
          allPatternsSelected,
          isLoadingStatisticsQuestions,
          isDownloadingQuestionsByContent,
          handleDirectoryChange,
          toggleAllPatterns,
          selectedFileCountForPattern,
          isPatternFullySelected,
          isPatternPartiallySelected,
          togglePatternSelection,
          togglePatternExpanded,
          selectedFileCountForFolder,
          isFolderFullySelected,
          isFolderPartiallySelected,
          toggleFolderSelection,
          toggleFolderExpanded,
          downloadLoadedQuestions,
          downloadSelectedQuestionsByContent,
          selectContentPath,
          clearContentSelection,
          loadSelectedStatisticsQuestions,
          formatPath,
          examKeys,
          selectedExamKey,
          questionsByExam,
          questions,
          answerKey,
          selectedQuestionIndex,
          selectedAlternative,
          forceShowAnswer,
          errorMessage,
          selectPlaceholder,
          currentQuestion,
          alternativeEntries,
          answerStatus,
          handleFileChange,
          alternativeClass,
          buildImageSource,
          renderRichText,
          resetAnswerState,
          handleQuestionChange,
          isMissingImage,
          pasteImage,
          saveMessage,
          loadedJson,
          isJsonEditorOpen,
          jsonEditorText,
          jsonEditorError,
          isSavingJson,
          openJsonEditor,
          closeJsonEditor,
          validateJsonEditor,
          formatJsonEditor,
          saveJsonEditor,
        };
      },
    }).mount("#app");
  </script>
</body>
