<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipboard Image to Base64 Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body class="min-h-screen bg-slate-100 text-slate-800">
    <div id="app">
      <main class="mx-auto flex min-h-screen max-w-4xl items-center px-6 py-12">
        <section class="w-full rounded-2xl bg-white p-8 shadow-lg">
          <header class="text-center">
            <h1 class="text-3xl font-bold">
              Clipboard Image to Base64 Converter
            </h1>

            <p class="mt-3 text-slate-600">
              Copie uma imagem e pressione
              <kbd class="rounded bg-slate-200 px-2 py-1 font-mono text-sm">
                Ctrl + V
              </kbd>
            </p>
          </header>

          <div
            class="mt-8 flex min-h-72 items-center justify-center overflow-hidden rounded-xl border-2 border-dashed p-4 transition"
            :class="imageUrl
                        ? 'border-blue-400 bg-blue-50'
                        : 'border-slate-300 bg-slate-50'"
          >
            <img
              v-if="imageUrl"
              :src="imageUrl"
              alt="Imagem colada"
              class="max-h-[28rem] max-w-full rounded-lg object-contain"
            />

            <p v-else class="text-center text-slate-500">
              A imagem colada aparecerá aqui.
            </p>
          </div>

          <div
            v-if="message"
            class="mt-5 rounded-lg px-4 py-3 text-center font-medium"
            :class="hasError
                        ? 'bg-red-100 text-red-700'
                        : 'bg-emerald-100 text-emerald-700'"
            aria-live="polite"
          >
            {{ message }}
          </div>

          <div v-if="base64" class="mt-6">
            <label for="base64" class="mb-2 block font-semibold">
              Base64 gerado
            </label>

            <textarea
              id="base64"
              v-model="base64"
              readonly
              class="h-40 w-full resize-y rounded-lg border border-slate-300 p-3 font-mono text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            ></textarea>

            <button
              type="button"
              class="mt-3 w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 active:bg-blue-800"
              @click="copyBase64"
            >
              Copiar novamente
            </button>
          </div>
        </section>
      </main>
    </div>

    <script>
      const { createApp, onMounted, onUnmounted, ref } = Vue;

      createApp({
        setup() {
          const imageUrl = ref("");
          const base64 = ref("");
          const message = ref("");
          const hasError = ref(false);

          const showMessage = (text, isError = false) => {
            message.value = text;
            hasError.value = isError;
          };

          const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();

              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(reader.error);

              reader.readAsDataURL(file);
            });
          };

          const copyBase64 = async () => {
            try {
              await navigator.clipboard.writeText(base64.value);

              showMessage("Base64 copiado para a área de transferência.");
            } catch (error) {
              console.error(error);

              showMessage(
                "Não foi possível copiar o Base64 automaticamente.",
                true,
              );
            }
          };

          const handlePaste = async (event) => {
            const items = Array.from(event.clipboardData?.items ?? []);

            const imageItem = items.find(
              (item) => item.kind === "file" && item.type.startsWith("image/"),
            );

            if (!imageItem) {
              showMessage(
                "Nenhuma imagem foi encontrada na área de transferência.",
                true,
              );

              return;
            }

            event.preventDefault();

            const imageFile = imageItem.getAsFile();

            if (!imageFile) {
              showMessage("Não foi possível ler a imagem colada.", true);

              return;
            }

            try {
              showMessage("Convertendo a imagem...");

              base64.value = await fileToBase64(imageFile);
              imageUrl.value = base64.value;

              await copyBase64();

              showMessage(
                "Imagem convertida e Base64 copiado automaticamente.",
              );
            } catch (error) {
              console.error(error);

              showMessage("Ocorreu um erro ao processar a imagem.", true);
            }
          };

          onMounted(() => {
            document.addEventListener("paste", handlePaste);
          });

          onUnmounted(() => {
            document.removeEventListener("paste", handlePaste);
          });

          return {
            imageUrl,
            base64,
            message,
            hasError,
            copyBase64,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
